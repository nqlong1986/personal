<style>

<body>

<div class="container">

<h1>2048</h1>

<div class="score">
Score:
<span id="score">0</span>
</div>

<div id="board"></div>

<button onclick="restart()">Restart</button>

</div>

<script>

const SIZE = 4;

let board;
let score = 0;

const colors = {
0:"#cdc1b4",
2:"#eee4da",
4:"#ede0c8",
8:"#f2b179",
16:"#f59563",
32:"#f67c5f",
64:"#f65e3b",
128:"#edcf72",
256:"#edcc61",
512:"#edc850",
1024:"#edc53f",
2048:"#edc22e"
};

function restart(){
    board = Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    score = 0;
    addTile();
    addTile();
    draw();
}

function addTile(){

    let empty=[];

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){
            if(board[r][c]==0)
                empty.push([r,c]);
        }
    }

    if(empty.length==0) return;

    let [r,c]=empty[Math.floor(Math.random()*empty.length)];

    board[r][c]=Math.random()<0.9?2:4;
}

function draw(){

    const b=document.getElementById("board");

    b.innerHTML="";

    for(let r=0;r<SIZE;r++){
        for(let c=0;c<SIZE;c++){

            let value=board[r][c];

            let tile=document.createElement("div");

            tile.className="tile";

            tile.textContent=value?value:"";

            tile.style.background=colors[value]||"#3c3a32";

            tile.style.color=value<=4?"#776e65":"white";

            tile.style.fontSize=value>=1024?"22px":"30px";

            b.appendChild(tile);
        }
    }

    document.getElementById("score").textContent=score;
}

function slide(row){

    row=row.filter(v=>v);

    for(let i=0;i<row.length-1;i++){

        if(row[i]==row[i+1]){

            row[i]*=2;

            score+=row[i];

            row[i+1]=0;
        }
    }

    row=row.filter(v=>v);

    while(row.length<SIZE)
        row.push(0);

    return row;
}

function moveLeft(){

    let changed=false;

    for(let r=0;r<SIZE;r++){

        let old=[...board[r]];

        board[r]=slide(board[r]);

        if(old.toString()!=board[r].toString())
            changed=true;
    }

    return changed;
}

function moveRight(){

    let changed=false;

    for(let r=0;r<SIZE;r++){

        let old=[...board[r]];

        board[r]=slide(board[r].reverse()).reverse();

        if(old.toString()!=board[r].toString())
            changed=true;
    }

    return changed;
}

function moveUp(){

    let changed=false;

    for(let c=0;c<SIZE;c++){

        let col=[];

        for(let r=0;r<SIZE;r++)
            col.push(board[r][c]);

        let old=[...col];

        col=slide(col);

        for(let r=0;r<SIZE;r++)
            board[r][c]=col[r];

        if(old.toString()!=col.toString())
            changed=true;
    }

    return changed;
}

function moveDown(){

    let changed=false;

    for(let c=0;c<SIZE;c++){

        let col=[];

        for(let r=0;r<SIZE;r++)
            col.push(board[r][c]);

        let old=[...col];

        col=slide(col.reverse()).reverse();

        for(let r=0;r<SIZE;r++)
            board[r][c]=col[r];

        if(old.toString()!=col.toString())
            changed=true;
    }

    return changed;
}

function gameOver(){

    for(let r=0;r<SIZE;r++)
        for(let c=0;c<SIZE;c++)
            if(board[r][c]==0)
                return false;

    for(let r=0;r<SIZE;r++)
        for(let c=0;c<SIZE-1;c++)
            if(board[r][c]==board[r][c+1])
                return false;

    for(let c=0;c<SIZE;c++)
        for(let r=0;r<SIZE-1;r++)
            if(board[r][c]==board[r+1][c])
                return false;

    return true;
}

document.addEventListener("keydown",(e)=>{

    let moved=false;

    switch(e.key){

        case "ArrowLeft":
            moved=moveLeft();
            break;

        case "ArrowRight":
            moved=moveRight();
            break;

        case "ArrowUp":
            moved=moveUp();
            break;

        case "ArrowDown":
            moved=moveDown();
            break;

        default:
            return;
    }

    e.preventDefault();

    if(moved){

        addTile();

        draw();

        if(gameOver())
            setTimeout(()=>alert("Game Over!"),100);
    }

});

restart();

</script>
