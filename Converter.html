<section class="philosophy-pillars">
<div class="pillar">
    <h2 class="pillar-title">Pressure Converter</h2>
    <p class="pillar-description">
                        Use this tools for converting pressure to different units.
    </p>
    <input type="number" id="inputValue" placeholder="Enter value">

    <label>From:</label>
    <select id="fromUnit">
        <option value="Pa">Pascal (Pa)</option>
        <option value="kPa">Kilopascal (kPa)</option>
        <option value="MPa">Megapascal (MPa)</option>
        <option value="bar">Bar</option>
        <option value="mbar">Millibar (mbar)</option>
        <option value="psi">PSI</option>
        <option value="atm">Atmosphere (atm)</option>
        <option value="torr">Torr</option>
        <option value="mTorr">mTorr</option>
        <option value="mmHg">mmHg</option>
        <option value="inHg">inHg</option>
    </select>

    <label>To:</label>
    <select id="toUnit">
        <option value="Pa">Pascal (Pa)</option>
        <option value="kPa">Kilopascal (kPa)</option>
        <option value="MPa">Megapascal (MPa)</option>
        <option value="bar">Bar</option>
        <option value="mbar">Millibar (mbar)</option>
        <option value="psi">PSI</option>
        <option value="atm">Atmosphere (atm)</option>
        <option value="torr">Torr</option>
        <option value="mTorr">mTorr</option>
        <option value="mmHg">mmHg</option>
        <option value="inHg">inHg</option>
    </select>

    <button onclick="convertPressure()">Convert</button>

    <div class="result" id="result"></div>
</div>

<script>
function convertPressure() {
    const value = parseFloat(document.getElementById("inputValue").value);
    const from = document.getElementById("fromUnit").value;
    const to = document.getElementById("toUnit").value;

    if (isNaN(value)) {
        document.getElementById("result").innerText = "Please enter a valid number";
        return;
    }

    // Convert everything to Pascals
    let valueInPa;

    switch (from) {
        case "Pa": valueInPa = value; break;
        case "kPa": valueInPa = value * 1000; break;
        case "MPa": valueInPa = value * 1e6; break;
        case "bar": valueInPa = value * 100000; break;
        case "mbar": valueInPa = value * 100; break;
        case "psi": valueInPa = value * 6894.76; break;
        case "atm": valueInPa = value * 101325; break;
        case "torr": valueInPa = value * 133.322; break;
        case "mTorr": valueInPa = value * 0.133322; break;
        case "mmHg": valueInPa = value * 133.322; break;
        case "inHg": valueInPa = value * 3386.39; break;
    }

    // Convert from Pascals to target unit
    let result;

    switch (to) {
        case "Pa": result = valueInPa; break;
        case "kPa": result = valueInPa / 1000; break;
        case "MPa": result = valueInPa / 1e6; break;
        case "bar": result = valueInPa / 100000; break;
        case "mbar": result = valueInPa / 100; break;
        case "psi": result = valueInPa / 6894.76; break;
        case "atm": result = valueInPa / 101325; break;
        case "torr": result = valueInPa / 133.322; break;
        case "mTorr": result = valueInPa / 0.133322; break;
        case "mmHg": result = valueInPa / 133.322; break;
        case "inHg": result = valueInPa / 3386.39; break;
    }

    document.getElementById("result").innerText =
        value + " " + from + " = " + result.toFixed(6) + " " + to;
}
</script>
