<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Periodic Table Element Quiz - Test Your Chemistry Knowledge</title>
    <meta name="description" content="Challenge yourself with this interactive periodic table element quiz. Fill in the element names before the 15-minute timer runs out! Perfect for chemistry students.">
    <meta name="keywords" content="periodic table quiz, chemistry quiz, learn elements, science game, interactive periodic table">
    <meta name="author" content="Science Learning Hub">
    
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #2ecc71;
            --bg-color: #f9f9f9;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 5px;
            color: #2c3e50;
        }

        p.subtitle {
            color: #7f8c8d;
            font-size: 1.1rem;
        }

        #control-panel {
            background: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #2980b9;
        }

        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }

        #timer {
            color: #e74c3c;
        }

        /* Simplified Periodic Table Layout Grid Container */
        .quiz-container {
            display: grid;
            grid-template-columns: repeat(18, minmax(45px, 1fr));
            gap: 4px;
            max-width: 1200px;
            width: 100%;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            overflow-x: auto;
        }

        .element-box {
            aspect-ratio: 1;
            border: 1px solid #ccc;
            border-radius: 4px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #f1f2f6;
            position: relative;
            font-size: 0.75rem;
        }

        .element-box.empty {
            background: #fff;
        }

        .element-number {
            position: absolute;
            top: 2px;
            left: 3px;
            font-size: 0.6rem;
            color: #666;
        }

        .element-symbol {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 2px;
        }

        .element-input {
            width: 90%;
            border: none;
            border-bottom: 1px solid #aaa;
            text-align: center;
            font-size: 0.65rem;
            outline: none;
            background: transparent;
        }

        .element-input:focus {
            border-bottom-color: var(--primary-color);
        }

        .element-box.correct {
            background-color: var(--success-color);
            color: white;
            border-color: #27ae60;
        }

        .element-box.correct .element-number,
        .element-box.correct .element-symbol {
            color: white;
        }

        .element-box.correct .element-input {
            display: none; /* Hide input once answered correctly to show the resolved name */
        }

        .resolved-name {
            display: none;
            font-size: 0.6rem;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            width: 95%;
        }

        .element-box.correct .resolved-name {
            display: block;
        }

        #score-display {
            margin-top: 15px;
            font-size: 1.1rem;
            font-weight: bold;
        }
    </style>
</head>
<body>

        <button id="start-btn" onclick="startQuiz()">Start Quiz</button>

            {number: 107, symbol: "Bh", name: "bohrium", col: 7, row: 9},
            {number: 108, symbol: "Hs", name: "hassium", col: 8, row: 9},
            {number: 109, symbol: "Mt", name: "meitnerium", col: 9, row: 9},
            {number: 110, symbol: "Ds", name: "darmstadtium", col: 10, row: 9},
            {number: 111, symbol: "Rg", name: "roentgenium", col: 11, row: 9},
            {number: 112, symbol: "Cn", name: "copernicium", col: 12, row: 9},
            {number: 113, symbol: "Nh", name: "nihonium", col: 13, row: 9},
            {number: 114, symbol: "Fl", name: "flerovium", col: 14, row: 9},
            {number: 115, symbol: "Mc", name: "moscovium", col: 15, row: 9},
            {number: 116, symbol: "Lv", name: "livermorium", col: 16, row: 9},
            {number: 117, symbol: "Ts", name: "tennessine", col: 17, row: 9},
            {number: 118, symbol: "Og", name: "oganesson", col: 18, row: 9}
        ];

        let timerInterval;
        let timeLeft = 15 * 60; // 15 minutes in seconds
        let isRunning = false;
        let score = 0;

        const gridContainer = document.getElementById('periodic-grid');
        const timerDisplay = document.getElementById('timer');
        const scoreDisplay = document.getElementById('score');
        const startBtn = document.getElementById('start-btn');
        const pauseBtn = document.getElementById('pause-btn');

        // Initialize grid element boxes
        function initGrid() {
            gridContainer.innerHTML = '';
            
            // To properly place cells based on standard CSS grids layout mapping
            elementsData.forEach(el => {
                const box = document.createElement('div');
                box.className = 'element-box empty';
                box.style.gridColumn = el.col;
                box.style.gridRow = el.row;
                box.id = `box-${el.number}`;

                box.innerHTML = `
                    <span class="element-number">${el.number}</span>
                    <span class="element-symbol">${el.symbol}</span>
                    <input type="text" class="element-input" data-name="${el.name}" disabled autocomplete="off">
                    <span class="resolved-name">${el.name}</span>
                `;

                gridContainer.appendChild(box);
            });

            // Add input listeners for validation checks
            document.querySelectorAll('.element-input').forEach(input => {
                input.addEventListener('input', (e) => {
                    if (!isRunning) return;
                    const typedValue = e.target.value.trim().toLowerCase();
                    const targetName = e.target.getAttribute('data-name');
                    
                    if (typedValue === targetName) {
                        const parentBox = e.target.closest('.element-box');
                        if (!parentBox.classList.contains('correct')) {
                            parentBox.classList.remove('empty');
                            parentBox.classList.add('correct');
                            score++;
                            scoreDisplay.textContent = score;

                            // Check if all are completed
                            if (score === elementsData.length) {
                                endGame(true);
                            }
                        }
                    }
                });
            });
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function startQuiz() {
            if (!isRunning) {
                isRunning = true;
                startBtn.textContent = "Resume";
                startBtn.disabled = true;
                pauseBtn.disabled = false;

                // Enable inputs
                document.querySelectorAll('.element-input').forEach(input => {
                    if (!input.closest('.element-box').classList.contains('correct')) {
                        input.disabled = false;
                    }
                });

                // Focus first available input if nothing typed yet
                const firstInput = document.querySelector('.element-input:not([disabled])');
                if (firstInput) firstInput.focus();

                timerInterval = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        timerDisplay.textContent = formatTime(timeLeft);
                    } else {
                        endGame(false);
                    }
                }, 1000);
            }
        }

        function pauseQuiz() {
            if (isRunning) {
                isRunning = false;
                clearInterval(timerInterval);
                startBtn.disabled = false;
                pauseBtn.disabled = true;

                // Disable inputs during pause
                document.querySelectorAll('.element-input').forEach(input => {
                    input.disabled = true;
                });
            }
        }

        function endGame(isWon) {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.disabled = true;
            pauseBtn.disabled = true;

            // Lock all inputs
            document.querySelectorAll('.element-input').forEach(input => {
                input.disabled = true;
            });

            if (isWon) {
                alert(`Congratulations! You named all elements correctly with ${formatTime(timeLeft)} remaining!`);
            } else {
                alert(`Time's up! Your final score is ${score} out of 118 elements.`);
            }
        }

        // Initialize layout on page load
        initGrid();
    </script>
</body>
</html>
